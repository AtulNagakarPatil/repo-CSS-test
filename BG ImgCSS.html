<html>

<head>
    <title>BG Image</title>
    <style>
        body {
            background-image: url("CSS img/images.jpeg");
            color: aliceblue;
        }
        p{
            background-image: url("CSS img/paper.gif");
            color: black;
        }
    </style>
</head>
<body>
    <h1>The background-image property specifies an image to use as the background of an element.

        By default, the image is repeated so it covers the entire element.</h1>
        <p>The background-image repeated so it covers</p>
</body>

</html>
